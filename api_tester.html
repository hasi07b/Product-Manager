<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test Dashboard - Product Manager</title>
    <style>
        :root {
            --primary: #ff6c37;
            --bg: #1e1e1e;
            --sidebar: #252526;
            --text: #e1e1e1;
            --accent: #37373d;
            --success: #4caf50;
            --error: #f44336;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: var(--sidebar);
            border-right: 1px solid var(--accent);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header img {
            width: 30px;
            height: 30px;
        }

        .endpoint-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .endpoint-item {
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .endpoint-item:hover {
            background: var(--accent);
        }

        .endpoint-item.active {
            background: rgba(255, 108, 55, 0.1);
            color: var(--primary);
        }

        .method {
            font-weight: bold;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            min-width: 45px;
            text-align: center;
        }

        .GET { background: #61affe; color: #fff; }
        .POST { background: #49cc90; color: #fff; }
        .PUT { background: #fca130; color: #fff; }
        .DELETE { background: #f93e3e; color: #fff; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto;
        }

        .request-url {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--sidebar);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--accent);
        }

        .url-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: monospace;
            font-size: 16px;
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .response-container {
            flex: 1;
            background: #000;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            overflow: auto;
            border: 1px solid var(--accent);
            position: relative;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .string { color: #ce9178; }
        .number { color: #b5cea8; }
        .boolean { color: #569cd6; }
        .null { color: #569cd6; }
        .key { color: #9cdcfe; }

        h2 { margin-top: 0; }
        .loading {
            display: none;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <svg width="30" height="30" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" fill="#ff6c37"/>
                <path d="M50 20L75 65H25L50 20Z" fill="white"/>
            </svg>
            <h3 style="margin:0">API Tester</h3>
        </div>
        <div class="endpoint-list" id="endpoint-list">
            <!-- Endpoints will be added here -->
        </div>
    </div>

    <div class="main-content">
        <h2 id="endpoint-title">Select an endpoint</h2>
        <div class="request-url">
            <span id="current-method" class="method GET">GET</span>
            <input type="text" id="current-url" class="url-input" readonly>
            <button class="send-btn" onclick="sendRequest()">SEND</button>
        </div>

        <div id="request-body-container" style="display:none; margin-bottom: 20px;">
            <h4>Request Body</h4>
            <textarea id="request-body" style="width:100%; height:100px; background:#2d2d2d; color:#fff; border:1px solid #444; border-radius:4px; padding:10px; font-family:monospace;"></textarea>
        </div>

        <div class="response-container">
            <div id="status" class="status-badge"></div>
            <div id="loading" class="loading">Sending Request...</div>
            <pre id="response-output"></pre>
        </div>
    </div>

    <script>
        const endpoints = [
            { name: 'Test Connection', method: 'GET', url: 'http://localhost:5000/api/test' },
            { name: 'Get All Products', method: 'GET', url: 'http://localhost:5000/api/products' },
            { name: 'Auth: Register', method: 'POST', url: 'http://localhost:5000/api/auth/register', body: { username: 'testuser', email: 'test@example.com', password: 'password123' } },
            { name: 'Auth: Login', method: 'POST', url: 'http://localhost:5000/api/auth/login', body: { email: 'test@example.com', password: 'password123' } },
            { name: 'Create Product', method: 'POST', url: 'http://localhost:5000/api/products', body: { title: 'Postman Test Product', description: 'Created via API Tester', price: 150, category: 'Tech', image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30' }, auth: true }
        ];

        let activeEndpoint = null;
        let token = null;

        function init() {
            const list = document.getElementById('endpoint-list');
            endpoints.forEach((ep, index) => {
                const div = document.createElement('div');
                div.className = 'endpoint-item';
                div.innerHTML = `
                    <span class="method ${ep.method}">${ep.method}</span>
                    <span>${ep.name}</span>
                `;
                div.onclick = () => selectEndpoint(index, div);
                list.appendChild(div);
            });
        }

        function selectEndpoint(index, element) {
            document.querySelectorAll('.endpoint-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            activeEndpoint = endpoints[index];
            document.getElementById('endpoint-title').innerText = activeEndpoint.name;
            document.getElementById('current-method').innerText = activeEndpoint.method;
            document.getElementById('current-method').className = `method ${activeEndpoint.method}`;
            document.getElementById('current-url').value = activeEndpoint.url;

            const bodyContainer = document.getElementById('request-body-container');
            if (activeEndpoint.method !== 'GET') {
                bodyContainer.style.display = 'block';
                document.getElementById('request-body').value = JSON.stringify(activeEndpoint.body, null, 4);
            } else {
                bodyContainer.style.display = 'none';
            }

            document.getElementById('response-output').innerHTML = '';
            document.getElementById('status').innerText = '';
        }

        async function sendRequest() {
            if (!activeEndpoint) return;

            const output = document.getElementById('response-output');
            const status = document.getElementById('status');
            const loading = document.getElementById('loading');

            output.innerHTML = '';
            status.innerText = '';
            loading.style.display = 'block';

            try {
                const options = {
                    method: activeEndpoint.method,
                    headers: {
                        'Content-Type': 'application/json'
                    }
                };

                if (token && activeEndpoint.auth) {
                    options.headers['Authorization'] = `Bearer ${token}`;
                }

                if (activeEndpoint.method !== 'GET') {
                    options.body = document.getElementById('request-body').value;
                }

                const response = await fetch(activeEndpoint.url, options);
                const data = await response.json();

                if (activeEndpoint.name === 'Auth: Login' && data.token) {
                    token = data.token;
                    console.log('Token stored:', token);
                }

                status.innerText = `${response.status} ${response.statusText}`;
                status.style.background = response.ok ? 'var(--success)' : 'var(--error)';
                
                output.innerHTML = syntaxHighlight(JSON.stringify(data, null, 4));
            } catch (err) {
                status.innerText = 'Error';
                status.style.background = 'var(--error)';
                output.innerText = err.message;
            } finally {
                loading.style.display = 'none';
            }
        }

        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'key';
                    } else {
                        cls = 'string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'boolean';
                } else if (/null/.test(match)) {
                    cls = 'null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        init();
    </script>
</body>
</html>
